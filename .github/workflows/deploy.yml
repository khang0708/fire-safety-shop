name: CI/CD Pipeline - Deploy to VPS

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  test-and-build:
    name: 🧪 Kiểm thử & Đóng gói (CI)
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Tải mã nguồn từ GitHub
        uses: actions/checkout@v4

      - name: ⚙️ Cài đặt môi trường Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Cài đặt gói phụ thuộc
        run: npm ci

      - name: 🔍 Kiểm tra tiêu chuẩn mã nguồn (Lint)
        run: npm run lint

      - name: 🧪 Chạy bộ kiểm thử toàn diện (Unit, Security & Conflict Resolution)
        run: npm test

      - name: 🏗️ Kiểm tra đóng gói ứng dụng (Build)
        run: npm run build

  deploy-to-vps:
    name: 🚀 Tự động Deploy lên VPS (CD)
    needs: test-and-build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: 🔐 Kết nối SSH và chạy script cập nhật VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          passphrase: ${{ secrets.VPS_SSH_PASSPHRASE }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script_stop: true
          command_timeout: 30m
          script: |
            set -e
            echo "🚀 Kết nối tới VPS thành công!"
            
            TARGET_DIR="${{ secrets.VPS_TARGET_DIR }}"
            if [ -z "$TARGET_DIR" ]; then
              if [ -d "$HOME/fire-safety-shop" ]; then
                TARGET_DIR="$HOME/fire-safety-shop"
              elif [ -d "/root/fire-safety-shop" ]; then
                TARGET_DIR="/root/fire-safety-shop"
              elif [ -d "/var/www/fire-safety-shop" ]; then
                TARGET_DIR="/var/www/fire-safety-shop"
              else
                TARGET_DIR="fire-safety-shop"
              fi
            fi

            echo "📂 Thư mục triển khai: $TARGET_DIR"
            cd "$TARGET_DIR"

            # 1. Lấy mã mới nhưng CHƯA áp dụng; ghi nhớ commit đang chạy để có thể quay lại
            git fetch origin main
            export PREV_COMMIT="$(git rev-parse HEAD)"
            echo "📌 Commit đang chạy: $PREV_COMMIT"

            # 2. Chuyển/sao lưu dữ liệu ra DATA_DIR ngoài repo bằng script bản MỚI (từ origin/main), TRƯỚC khi git reset.
            #    Dữ liệu từng nằm trong git (server/data/*.json) sẽ bị reset xóa khỏi thư mục làm việc; script này giữ bản sao an toàn.
            git show origin/main:scripts/prepare-data.sh > /tmp/prepare-data.sh
            bash /tmp/prepare-data.sh prepare "$PWD"
            rm -f /tmp/prepare-data.sh

            # 3. Đồng bộ mã nguồn; giữ nguyên cấu hình nginx/SSL của VPS (file này bị ghi lại khi cấp chứng chỉ)
            echo "📥 Đồng bộ mã nguồn mới nhất từ GitHub..."
            NGINX_BACKUP="$(mktemp)"
            if [ -f nginx/conf.d/app.conf ]; then cp nginx/conf.d/app.conf "$NGINX_BACKUP"; fi
            # Gỡ file dữ liệu cũ (từng nằm trong git) khỏi CHỈ MỤC git của VPS để git reset không xóa chúng khỏi thư mục
            # làm việc: container cũ vẫn đang đọc/ghi các file này cho tới khi được thay thế. Dữ liệu đã có bản sao ở DATA_DIR.
            git ls-files -z server/data | xargs -0 -r git update-index --force-remove --
            git reset --hard origin/main
            if [ -s "$NGINX_BACKUP" ]; then cp "$NGINX_BACKUP" nginx/conf.d/app.conf; fi
            rm -f "$NGINX_BACKUP"

            # 4. Build, thử khởi động bản mới, thay container và kiểm tra sức khỏe (xem deploy.sh)
            chmod +x deploy.sh init-ssl.sh scripts/*.sh 2>/dev/null || true
            ./deploy.sh --no-sync
