name: CI/CD Pipeline - Deploy to VPS

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  test-and-build:
    name: 🧪 Kiểm thử & Đóng gói (CI)
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Tải mã nguồn từ GitHub
        uses: actions/checkout@v4

      - name: ⚙️ Cài đặt môi trường Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Cài đặt gói phụ thuộc
        run: npm ci

      - name: 🔍 Kiểm tra tiêu chuẩn mã nguồn (Lint)
        run: npm run lint

      - name: 🧪 Chạy bộ kiểm thử toàn diện (Unit, Security & Conflict Resolution)
        run: npm test

      - name: 🏗️ Kiểm tra đóng gói ứng dụng (Build)
        run: npm run build

  deploy-to-vps:
    name: 🚀 Tự động Deploy lên VPS (CD)
    needs: test-and-build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: 🔐 Kết nối SSH và chạy script cập nhật VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          passphrase: ${{ secrets.VPS_SSH_PASSPHRASE }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script_stop: true
          command_timeout: 30m
          script: |
            set -e
            echo "🚀 Kết nối tới VPS thành công!"
            
            TARGET_DIR="${{ secrets.VPS_TARGET_DIR }}"
            if [ -z "$TARGET_DIR" ]; then
              if [ -d "$HOME/fire-safety-shop" ]; then
                TARGET_DIR="$HOME/fire-safety-shop"
              elif [ -d "/root/fire-safety-shop" ]; then
                TARGET_DIR="/root/fire-safety-shop"
              elif [ -d "/var/www/fire-safety-shop" ]; then
                TARGET_DIR="/var/www/fire-safety-shop"
              else
                TARGET_DIR="fire-safety-shop"
              fi
            fi

            echo "📂 Thư mục triển khai: $TARGET_DIR"
            cd "$TARGET_DIR"

            # 1. Sao lưu tạm thời dữ liệu thực tế tại server/data và cấu hình SSL
            BACKUP_DIR="/tmp/flameguard_deploy_backup_$(date +%s)"
            mkdir -p "$BACKUP_DIR"
            if [ -d "server/data" ]; then
              cp -r server/data "$BACKUP_DIR/"
            fi
            if [ -f "nginx/conf.d/app.conf" ]; then
              cp nginx/conf.d/app.conf "$BACKUP_DIR/app.conf"
            fi

            # 2. Đồng bộ mã nguồn mới nhất từ nhánh main (giải quyết triệt để lỗi xung đột git pull)
            echo "📥 Đồng bộ mã nguồn mới nhất từ GitHub..."
            git fetch origin main
            git reset --hard origin/main

            # 3. Khôi phục lại dữ liệu và cấu hình SSL
            if [ -d "$BACKUP_DIR/data" ]; then
              cp -r "$BACKUP_DIR/data"/* server/data/ 2>/dev/null || true
            fi
            if [ -f "$BACKUP_DIR/app.conf" ]; then
              cp "$BACKUP_DIR/app.conf" nginx/conf.d/app.conf
            fi
            rm -rf "$BACKUP_DIR"

            # Đảm bảo loại bỏ triệt để sản phẩm hoa cũ fl-1787735321783 khỏi server/data/products.json
            if [ -f "server/data/products.json" ]; then
              node -e "
                const fs = require('fs');
                try {
                  let p = JSON.parse(fs.readFileSync('server/data/products.json', 'utf8'));
                  p = p.filter(x => x.id !== 'fl-1787735321783' && !x.id.startsWith('fl-') && !x.name.includes('Hoa Hồng'));
                  fs.writeFileSync('server/data/products.json', JSON.stringify(p, null, 2));
                } catch(e) {}
              " 2>/dev/null || true
            fi

            # 4. Đảm bảo quyền thực thi và chạy deploy
            chmod +x deploy.sh init-ssl.sh 2>/dev/null || true
            ./deploy.sh
