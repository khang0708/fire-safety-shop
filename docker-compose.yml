services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: fire-safety-shop-web:latest
    container_name: flameguard-web
    restart: always
    environment:
      - PORT=3001
      - NODE_ENV=production
      # Dữ liệu chạy thật nằm ở /data trong container = ${DATA_DIR} trên VPS (ngoài thư mục repo)
      - DATA_DIR=/data
      # Chạy sau Nginx (1 lớp proxy) để lấy đúng IP khách cho giới hạn đăng nhập
      - TRUST_PROXY_HOPS=1
      - DATABASE_URL=${DATABASE_URL:-}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}
      - DEV_ALERT_TELEGRAM_TOKEN=${DEV_ALERT_TELEGRAM_TOKEN:-}
      - DEV_ALERT_TELEGRAM_CHAT_ID=${DEV_ALERT_TELEGRAM_CHAT_ID:-}
      - DOMAIN=${DOMAIN:-pcccphatantam.com}
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      # Chỉ dùng để tạo tài khoản admin lần đầu (khi chưa có admins.json). KHÔNG có giá trị mặc định.
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
      - ADMIN_PIN=${ADMIN_PIN:-}
      - SESSION_SECRET=${SESSION_SECRET:-}
      - FACEBOOK_APP_SECRET=${FACEBOOK_APP_SECRET:-}
    volumes:
      # Giữ nguyên dữ liệu sản phẩm, đơn hàng, cài đặt, tài khoản admin khi cập nhật container.
      # Thư mục này nằm NGOÀI repo nên git reset --hard khi deploy không bao giờ chạm tới.
      - ${DATA_DIR:-/var/lib/fire-safety-data}:/data
    ports:
      - "127.0.0.1:3001:3001"
    expose:
      - "3001"
    networks:
      - flameguard-net

  nginx:
    image: nginx:alpine
    container_name: flameguard-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    depends_on:
      - web
    networks:
      - flameguard-net

  certbot:
    image: certbot/certbot
    container_name: flameguard-certbot
    restart: unless-stopped
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    networks:
      - flameguard-net

networks:
  flameguard-net:
    driver: bridge
