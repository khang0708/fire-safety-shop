# Giới hạn tần suất đăng nhập admin theo IP (khai báo ở ngữ cảnh http; file conf.d được include trong http)
limit_req_zone $binary_remote_addr zone=fs_login:10m rate=10r/m;
server_tokens off;

server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Giới hạn kích thước file upload (ảnh chuyển khoản, ảnh sản phẩm)
    client_max_body_size 30M;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Nơi xác thực chứng chỉ SSL Let's Encrypt (Certbot ACME Challenge)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Luồng sự kiện thời gian thực (SSE) của admin: không đệm, không bị ngắt sau 90 giây
    location = /api/admin/events {
        proxy_pass http://web:3001;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    # Đăng nhập admin: giới hạn tần suất thêm một lớp ở Nginx (~10 lần/phút/IP, cho dồn 5)
    location = /api/auth/login {
        limit_req zone=fs_login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://web:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90;
    }

    # Reverse proxy toàn bộ request sang ứng dụng Node.js Express
    location / {
        proxy_pass http://web:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 90;
    }
}
